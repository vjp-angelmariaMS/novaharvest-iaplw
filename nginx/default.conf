
# Primer servidor: se encarga de redirigir todas las peticiones HTTP a HTTPS
server {
    # puerto HTTP de Nginx
    listen 80;
    server_name localhost;

    return 301 https://$host:8443$request_uri;
}

# Segundo servidor: se encarga de atender las peticiones mediante HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    # certificado y clave privada
    ssl_certificate /etc/nginx/certs/novaharvest.crt;
    ssl_certificate_key /etc/nginx/certs/novaharvest.key;

    # directorio donde se encuentra la web
    root /usr/share/nginx/html;
    index index.php index.html;

    # para activar compresión gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # para limitar el tamaño de las peticiones a 64 KB
    client_max_body_size 64K;

    # para establecer la página personalizada para errores 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # para establecer la página personalizada para errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # para servir archivos Markdown como texto UTF-8
    location ~* \.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # para enviar los archivos PHP al contenedor PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
