server {
    # Puerto HTTP de Nginx
    listen 80;

    # Directorio donde se encuentra la web
    root /usr/share/nginx/html;
    index index.php index.html;

    # Activar compresión gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    client_max_body_size 10M;

    # Página personalizada para errores 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Página personalizada para errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Servir archivos Markdown como texto UTF-8
    location ~* \.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # Enviar los archivos PHP al contenedor PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}