; Configuración del pool de procesos PHP-FPM
[www]

; el usuario y grupo con los que trabajan los procesos PHP
user = www-data
group = www-data

; el puerto donde escucha PHP-FPM
listen = 9000

; para gestionar dinámicamente los procesos
pm = dynamic

; el número máximo de procesos simultáneos
pm.max_children = 5

; los procesos que arrancan inicialmente
pm.start_servers = 2

; el número mínimo de procesos disponibles
pm.min_spare_servers = 1

; el número máximo de procesos disponibles
pm.max_spare_servers = 3