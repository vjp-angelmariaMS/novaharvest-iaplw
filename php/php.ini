;  para mostrar la memoria máxima por script
memory_limit = 128M

; para mostrar todos los errores durante el desarrollo
error_reporting = E_ALL

; para no mostrar errores al visitante(evitar que se vea información sensible)
display_errors = Off

; para guardar los errores en los registros
log_errors = On

; para establecer la zona horaria de España
date.timezone = Europe/Madrid